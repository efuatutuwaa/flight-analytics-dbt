version: 2

models:
  - name: mart_flight_performance
    description: "Route-level flight performance metrics per airline per day."
    columns:
      - name: route_key
        description: "Grain key. Derived route identifier in format 'departure_airport_id-arrival_airport_id'."
        tests:
          - not_null
          - relationships:
              to: ref('dim_routes')
              field: route_key
      - name: operating_airline_id
        description: "Grain key. Foreign key to dim_airline for the operating airline."
        tests:
          - not_null
          - relationships:
              to: ref('dim_airline')
              field: airline_id
      - name: flight_date
        description: "Grain key. Date the flights were scheduled to operate."
        tests:
          - not_null
      - name: total_flights
        description: "Total number of flights for this route, airline, and date combination."
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              severity: warn
      - name: cancellation_rate
        description: "Proportion of flights cancelled. Value between 0 and 1."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              severity: warn
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - route_key
            - operating_airline_id
            - flight_date

  - name: mart_route_performance
    description: "Route-level flight performance metrics aggregated across all airlines and dates."
    columns:
      - name: route_key
        description: "Grain key. Foreign key to dim_routes."
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_routes')
              field: route_key
      - name: total_flights
        description: "Total number of flights operated on this route."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              severity: warn
      - name: airlines_competing
        description: "Number of distinct airlines operating this route."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              severity: warn
      - name: cancellation_rate
        description: "Proportion of flights cancelled. Value between 0 and 1."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              severity: warn

  - name: mart_airport_operations
    description: "Airport-level flight operations metrics aggregated across all departures and arrivals."
    columns:
      - name: airport_id
        description: "Grain key. Foreign key to dim_airport."
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_airport')
              field: airport_id
      - name: total_departures
        description: "Total number of flights departing from this airport."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              severity: warn
      - name: total_arrivals
        description: "Total number of flights arriving at this airport."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              severity: warn
      - name: total_movements
        description: "Total traffic at the airport. Sum of total_departures and total_arrivals."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              severity: warn

  - name: mart_airline_performance
    description: "Airline-level flight performance metrics aggregated across all routes and dates."
    columns:
      - name: operating_airline_id
        description: "Grain key. Foreign key to dim_airline for the operating airline."
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_airline')
              field: airline_id
      - name: total_flights
        description: "Total number of flights operated by the airline."
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              severity: warn
      - name: total_routes_served
        description: "Number of distinct routes operated by the airline."
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              severity: warn
      - name: cancellation_rate
        description: "Proportion of flights cancelled. Value between 0 and 1."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              severity: warn

  - name: mart_codeshare_complexity
    description: "Codeshare partnership metrics. One row per operating airline + marketing airline pair."
    columns:
      - name: operating_airline_id
        description: "Grain key. Foreign key to dim_airline for the airline physically operating the flight."
        tests:
          - not_null
          - relationships:
              to: ref('dim_airline')
              field: airline_id
      - name: marketing_airline_id
        description: "Grain key. Foreign key to dim_airline for the airline selling the ticket."
        tests:
          - not_null
          - relationships:
              to: ref('dim_airline')
              field: airline_id
      - name: total_codeshare_flights
        description: "Total number of flights in this operating + marketing airline partnership."
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              severity: warn
      - name: total_routes_shared
        description: "Number of distinct routes shared between the operating and marketing airline."
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              severity: warn
      - name: total_true_codeshares
        description: "Number of flights where the operating and marketing airline differ."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              severity: warn
      - name: codeshare_rate
        description: "Proportion of flights that are true codeshares. Value between 0 and 1."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              severity: warn
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - operating_airline_id
            - marketing_airline_id
